{% extends "base.html" %}

{% block content %}

<div class="auth card">

    <h1>
        Welcome back
    </h1>

    <p>
        Login to access your PocketSmart plans.
    </p>

    <form id="loginForm">

        <input
            name="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >

        <button
            class="btn"
            type="submit"
        >
            Login
        </button>

    </form>

    <p id="msg"></p>

    <p>
        New here?
        <a href="/register">
            Create an account
        </a>
    </p>

</div>

{% endblock %}
