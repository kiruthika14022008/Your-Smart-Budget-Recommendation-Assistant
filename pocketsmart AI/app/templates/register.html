{% extends "base.html" %}

{% block content %}

<div class="auth card">

    <h1>
        Create your account
    </h1>

    <p>
        Start building personalized budget plans.
    </p>

    <form id="registerForm">

        <input
            name="name"
            placeholder="Full name"
            required
            minlength="2"
        >

        <input
            name="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Password (minimum 6 characters)"
            required
            minlength="6"
        >

        <button
            class="btn"
            type="submit"
        >
            Register
        </button>

    </form>

    <p id="msg"></p>

    <p>
        Already registered?

        <a href="/login">
            Login
        </a>
    </p>

</div>

{% endblock %}
